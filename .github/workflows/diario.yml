name: Búsqueda diaria

on:
  schedule:
    - cron: "0 12 * * *"   # 7:00 a. m. hora de Bogotá
  workflow_dispatch:        # botón "Run workflow" para correrlo a mano
  push:
    branches: [main]
    paths: ["buscador/**", "perfil.json", "requirements.txt", ".github/workflows/diario.yml"]

permissions:
  contents: write

concurrency:
  group: busqueda
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar JobSpy (LinkedIn e Indeed)
        continue-on-error: true
        run: pip install -r requirements.txt
      - name: Pruebas
        run: python -m unittest discover tests
      - name: Buscar ofertas y generar la página
        run: python -m buscador
      - name: Guardar resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Ofertas del $(TZ=America/Bogota date +%F)"
          git pull --rebase origin main
          git push
      - name: Aviso por WhatsApp (opcional)
        if: github.event_name != 'push'
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: python -m buscador.aviso
